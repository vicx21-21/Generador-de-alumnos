<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de alumnos</title>
    <script src="./js/functions.js"></script>
    <style>
        :root {
            --rosa-header: #ff0bef; 
            --bg-gris:url('fondooo.jpg');
            --btn-oscuro-1: #1c389d;
            --btn-oscuro-2: #1c389d;
            --btn-oscuro-3: #523896;
            --btn-oscuro-4: #523896;
        }

        body {
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    
  
    background-image: var(--bg-gris);
    background-size: cover;      
    background-attachment: fixed; 
    background-repeat: no-repeat; 
    
    display: flex;
    justify-content: center;
    padding: 40px 20px;
    margin: 0;
        }

        
        .card {
            background: white;
            width: 100%;
            max-width: 700px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border: 1px solid #d1d1d1;
        }

        .header {
            background-color: var(--rosa-header);
            padding: 20px;
            color: white;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .content {
            padding: 30px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #444;
        }

        input[type="number"], select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            border-color: var(--rosa-header);
            outline: none;
        }

        .grid-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        input[type="button"] {
            cursor: pointer;
            border: none;
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        input[type="button"]:hover {
            filter: brightness(1.3);
            transform: translateY(-2px);
        }

        .btn-1 { background-color: var(--btn-oscuro-1); }
        .btn-50k { background-color: var(--btn-oscuro-2); }
        .btn-gen { background-color: var(--btn-oscuro-3); }
        .btn-save { background-color: var(--btn-oscuro-4); }

        .full-width {
            grid-column: span 2;
            padding: 15px;
            font-size: 1rem !important;
        }

        
        #salida {
            margin-top: 25px;
            background: #1e1e1e;
            color: #fa0ceb;   
            padding: 20px;
            border-radius: 10px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9rem;
            min-height: 300px; 
            max-height: 500px; 
            overflow-y: auto;
            border: 2px solid #333;
            white-space: pre-wrap;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">Generador de Alumnos</div>
        
        <div class="content">
            <label>CANTIDAD DE REGISTROS A GENERAR:</label>
            <input type="number" id="registros" value="1" min="1" max="50000">
            
            <div class="grid-buttons">
                <input type="button" class="btn-1" value="Mínimo (1)" onclick="document.getElementById('registros').value=1;">
                <input type="button" class="btn-50k" value="Máximo (50,000)" onclick="document.getElementById('registros').value=50000;">
                
                <label class="full-width" style="margin-bottom: -5px; padding: 0;">FORMATO DE EXPORTACIÓN:</label>
                <select id="opcion" class="full-width">
                    <option value="1">SQL MySQL / MariaDB</option>
                    <option value="2">PostgreSQL</option>
                    <option value="3">Archivo CSV (Excel)</option>
                    <option value="4">Formato JSON</option>
                </select>

                <input type="button" class="btn-gen full-width" value="Generar Alumnos" onclick="ejecutarProceso()">
                <input type="button" class="btn-save full-width" value="Guardar en Archivo" onclick="guardarArchivo()">
            </div>

            <label style="margin-top: 30px;">VISTA PREVIA DE RESULTADOS:</label>
            <p id="salida">Los datos generados aparecerán en esta consola...</p>
        </div>
    </div>

</body>
</html>
